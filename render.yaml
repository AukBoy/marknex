# Render Blueprint — one free web service that builds the React frontend
# and runs the Express backend (which serves both the API and the frontend).
#
# After pushing this repo to GitHub:
#   Render Dashboard → New → Blueprint → pick this repo → Apply.
# Then set the secret env vars (OPENAI_API_KEY) in the dashboard.
# Free Postgres database — data persists across deploys.
databases:
  - name: marknex-db
    plan: free

services:
  - type: web
    name: marknex
    runtime: node
    plan: free
    # Install frontend deps (incl. dev deps like Vite — NODE_ENV=production would
    # otherwise skip them), build it, then install backend production deps.
    buildCommand: cd frontend && npm install --include=dev && npm run build && cd ../backend && npm install
    # Start the Express server (it serves /api and the built frontend).
    startCommand: cd backend && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      # Postgres connection string — wired automatically from the database above.
      - key: DATABASE_URL
        fromDatabase:
          name: marknex-db
          property: connectionString
      # JWT signing secret — fixed value so login tokens survive redeploys.
      - key: JWT_SECRET
        generateValue: true
      # Your OpenAI key — set this in the Render dashboard (marked sync:false so
      # it is NOT stored in the repo).
      - key: OPENAI_API_KEY
        sync: false
      # Optional invite code: when set, new teacher signups must supply it.
      # Protects a public URL from strangers consuming the OpenAI budget.
      - key: SIGNUP_CODE
        sync: false
